<section class="infografis-section">
  <h1>INFOGRAFIS</h1>

  <div class="grid">
    <div class="info-card" data-img="img/Infografis1.png">
      <h3>Topik 1</h3>
      <p>Klik untuk lihat infografis</p>
    </div>

    <div class="info-card" data-img="img/info2.jpg">
      <h3>Topik 2</h3>

    <div class="info-card" data-img="img/info3.jpg">

      <p>Klik untuk lihat infografis</p>
    </div>
  </div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="close">&times;</span>
  <img id="modal-img" src="" alt="Infografis">
</div>

<script>
const cards = document.querySelectorAll(".info-card");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modal-img");
const closeBtn = document.querySelector(".close");

cards.forEach(card => {
  card.addEventListener("click", () => {
    modalImg.src = card.dataset.img;
    modal.style.display = "flex";
  });
});

closeBtn.addEventListener("click", () => {
  modal.style.display = "none";
});

modal.addEventListener("click", (e) => {
  if(e.target === modal){
    modal.style.display = "none";
  }
});
</script>
